# ─── Bluetooth ────────────────────────────────────────────────────────────────
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="AURA Orbit"
CONFIG_BT_DEVICE_NAME_DYNAMIC=n
CONFIG_BT_SMP=y
CONFIG_BT_SMP_SC_ONLY=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_PRIVACY=y
CONFIG_BT_RPA_TIMEOUT=900
CONFIG_BT_GATT_DYNAMIC_DB=n
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=4
CONFIG_BT_L2CAP_TX_MTU=185
CONFIG_BT_BUF_ACL_TX_SIZE=201
CONFIG_BT_BUF_ACL_RX_SIZE=201

# ─── GPIO ──────────────────────────────────────────────────────────────────────
CONFIG_GPIO=y

# ─── I2C ──────────────────────────────────────────────────────────────────────
CONFIG_I2C=y

# ─── Power Management ─────────────────────────────────────────────────────────
CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y

# ─── Timers / Workqueues ──────────────────────────────────────────────────────
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# ─── Logging ──────────────────────────────────────────────────────────────────
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BACKEND_UART=y

# ─── Main stack ───────────────────────────────────────────────────────────────
CONFIG_MAIN_STACK_SIZE=4096

# ─── Assert ───────────────────────────────────────────────────────────────────
CONFIG_ASSERT=y

# ─── NVS (bond storage) ───────────────────────────────────────────────────────
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_BT_SETTINGS=y

# ─── Entropy (TRNG for SMP) ───────────────────────────────────────────────────
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=n
