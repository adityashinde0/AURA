openapi: 3.1.0
info:
  title: Project AURA — Cloud Intake & Control Plane API
  version: 1.0.0
  description: >
    Production Cloud Intake and Control Plane API for Project AURA.
    Provides authenticated, purpose-bound ingress for minimized focus signals,
    calendar preparation, consent grant lifecycle, and audit/undo controls.
servers:
  - url: https://api.aura.internal/v1
    description: Production Regional Cell
  - url: https://api-dev.aura.internal/v1
    description: Development Environment

paths:
  /api/v1/focus/signal:
    post:
      summary: Intake minimized focus signal
      operationId: intakeFocusSignal
      description: >
        Receives an explicit or consented focus signal. Strictly rejects raw transcript text,
        evaluates against policy boundaries, and returns a proposed action with citations.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FocusSignalRequest'
      responses:
        '200':
          description: Proposal evaluated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FocusSignalResponse'
        '400':
          description: Malformed or non-minimized payload rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing or revoked consent grant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/focus/session:
    post:
      summary: Start or terminate a focus session
      operationId: manageFocusSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FocusSessionRequest'
      responses:
        '200':
          description: Session state updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FocusSessionResponse'
        '400':
          description: Invalid session parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/consent/grants:
    get:
      summary: List user consent grants
      operationId: listConsentGrants
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of active consent grants
          content:
            application/json:
              schema:
                type: object
                required:
                  - user_id
                  - grants
                properties:
                  user_id:
                    type: string
                  grants:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConsentGrant'
    post:
      summary: Create or update a consent grant
      operationId: createConsentGrant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConsentGrantRequest'
      responses:
        '201':
          description: Consent grant created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentGrant'
        '400':
          description: Invalid grant parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/consent/grants/{grantId}:
    delete:
      summary: Revoke consent grant immediately
      operationId: revokeConsentGrant
      description: Invalidate consent grant and clear cached grants in <60 seconds.
      parameters:
        - name: grantId
          in: path
          required: true
          schema:
            type: string
        - name: user_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Grant revoked successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - revoked
                  - grant_id
                  - revoked_at
                properties:
                  revoked:
                    type: boolean
                    enum: [true]
                  grant_id:
                    type: string
                  revoked_at:
                    type: number

  /api/v1/audit/actions:
    get:
      summary: Query action audit log
      operationId: queryAuditLog
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Audit log records
          content:
            application/json:
              schema:
                type: object
                required:
                  - user_id
                  - records
                properties:
                  user_id:
                    type: string
                  records:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditRecord'

  /api/v1/actions/undo:
    post:
      summary: Execute action reversal using undo token
      operationId: executeUndo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - undo_token
                - user_id
              properties:
                undo_token:
                  type: string
                user_id:
                  type: string
      responses:
        '200':
          description: Action reversed
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - undo_token
                  - message
                properties:
                  success:
                    type: boolean
                  undo_token:
                    type: string
                  message:
                    type: string

  /api/v1/calendar/events:
    post:
      summary: Intake and normalize calendar events for T-5 preparation
      operationId: intakeCalendarEvent
      description: >
        Receives calendar event payloads from Google Calendar, Outlook, or AURA webhooks.
        Normalizes into canonical CalendarEvent, evaluates quiet hours and opt-in,
        and schedules EventBridge T-5 MeetingPrepTriggered events.
      parameters:
        - name: x-calendar-source
          in: header
          required: false
          schema:
            type: string
            enum: [google, outlook, aura]
            default: aura
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - calendar_event_id
                - user_id
                - title
                - start_epoch
                - end_epoch
              properties:
                calendar_event_id:
                  type: string
                user_id:
                  type: string
                title:
                  type: string
                start_epoch:
                  type: integer
                end_epoch:
                  type: integer
                participants:
                  type: array
                  items:
                    type: string
                is_opted_in:
                  type: boolean
                  default: true
                status:
                  type: string
                  enum: [confirmed, tentative, cancelled]
      responses:
        '200':
          description: Event processed successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - result
                properties:
                  message:
                    type: string
                  result:
                    type: object
        '400':
          description: Malformed calendar event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/devices:
    get:
      summary: List registered devices and certification standards
      operationId: listDevices
      responses:
        '200':
          description: Devices retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required: [devices, total]
                properties:
                  devices:
                    type: array
                    items:
                      type: object
                  total:
                    type: integer
    post:
      summary: Register a certified smart home device
      operationId: registerDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id, name]
              properties:
                device_id:
                  type: string
                name:
                  type: string
                device_type:
                  type: string
                  enum: [fire_tv, echo_speaker, generic_smart_device]
                household_id:
                  type: string
                certification_status:
                  type: string
                  enum: [certified, staged, sandbox, uncertified]
                certification_standard:
                  type: string
      responses:
        '201':
          description: Device registered successfully

  /api/v1/feature-flags:
    get:
      summary: Get all multi-tier feature flags and kill switches
      operationId: getFeatureFlags
      responses:
        '200':
          description: Feature flags retrieved
    post:
      summary: Update multi-tier feature flag or emergency kill switch
      operationId: updateFeatureFlag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [level, capability]
              properties:
                level:
                  type: string
                  enum: [global, tenant, user, rollout]
                capability:
                  type: string
                enabled:
                  type: boolean
                percentage:
                  type: integer
      responses:
        '200':
          description: Flag updated successfully

  /api/v1/safety/guardrails:
    get:
      summary: Query undo rate metrics and circuit breaker status
      operationId: getSafetyGuardrails
      parameters:
        - name: user_id
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Guardrail telemetry retrieved

  /api/v1/safety/guardrails/reset:
    post:
      summary: Reset safety circuit breaker for a user and action policy
      operationId: resetSafetyGuardrail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, action_type]
              properties:
                user_id:
                  type: string
                action_type:
                  type: string
      responses:
        '200':
          description: Circuit breaker reset successfully

  /api/v1/slack/oauth/authorize:
    post:
      summary: Initiate Slack OAuth 2.0 PKCE handshake
      operationId: initiateSlackOAuth
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                scopes:
                  type: array
                  items:
                    type: string
                redirect_uri:
                  type: string
      responses:
        '200':
          description: Authorization URL and PKCE challenge generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlackOAuthAuthorizeResponse'

  /api/v1/slack/oauth/callback:
    post:
      summary: Complete Slack OAuth 2.0 PKCE token exchange
      operationId: completeSlackOAuth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SlackOAuthCallbackRequest'
      responses:
        '200':
          description: Workspace connected and token reference stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlackOAuthCallbackResponse'

  /api/v1/slack/preview:
    get:
      summary: Preview exact Slack ambient status before posting
      operationId: getSlackPreview
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
        - name: duration_minutes
          in: query
          required: false
          schema:
            type: integer
            default: 45
        - name: target_channel
          in: query
          required: false
          schema:
            type: string
            default: user_profile
      responses:
        '200':
          description: Preview generated with zero leakage guarantee
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlackPreviewResponse'

  /api/v1/slack/status:
    post:
      summary: Publish minimal ambient availability status to Slack
      operationId: publishSlackStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SlackStatusPublishRequest'
      responses:
        '200':
          description: Ambient status published with reversible undo token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlackStatusPublishResponse'
    delete:
      summary: Clear active Slack ambient status
      operationId: clearSlackStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id:
                  type: string
                workspace_id:
                  type: string
      responses:
        '200':
          description: Status cleared successfully

  /api/v1/slack/workspaces:
    get:
      summary: List registered Slack workspaces and channel allowlists
      operationId: listSlackWorkspaces
      responses:
        '200':
          description: List of workspaces

  /api/v1/slack/admin-review:
    post:
      summary: Record workspace-admin security review and channel boundary definition
      operationId: reviewSlackWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SlackAdminReviewRequest'
      responses:
        '200':
          description: Admin review recorded

components:
  schemas:
    FocusSignalRequest:
      type: object
      required:
        - user_id
        - session_id
        - purpose
        - explicit_signal
      properties:
        user_id:
          type: string
          minLength: 3
          maxLength: 128
        session_id:
          type: string
          minLength: 8
          maxLength: 128
        purpose:
          type: string
          enum: [pre_meeting, focus_guardian]
        explicit_signal:
          type: string
          enum: [none, self_report_distracted, focus_started]
        evidence:
          type: array
          maxItems: 5
          items:
            type: object
            required:
              - id
              - snippet
            properties:
              id:
                type: string
              snippet:
                type: string
                maxLength: 200
        consented_signal_score:
          type: number
          minimum: 0.0
          maximum: 1.0
          default: 0.0

    FocusProposal:
      type: object
      required:
        - prep_summary
        - 3_questions
        - emotion_tone
        - is_distracted
        - distraction_score
        - deep_work_bank_delta
        - evidence_ids
        - recommended_action
        - reason
      properties:
        prep_summary:
          type: string
          maxLength: 500
        3_questions:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: string
        emotion_tone:
          type: string
          enum: [calm, confident, supportive, neutral, cautious]
        is_distracted:
          type: boolean
        distraction_score:
          type: number
          minimum: 0.0
          maximum: 1.0
        deep_work_bank_delta:
          type: integer
          minimum: -10
          maximum: 10
        evidence_ids:
          type: array
          maxItems: 5
          items:
            type: string
        recommended_action:
          type: string
          enum: [none, nudge, request_dnd, request_pause]
        reason:
          type: string
          maxLength: 280

    FocusSignalResponse:
      type: object
      required:
        - proposal
        - policy_required
      properties:
        proposal:
          $ref: '#/components/schemas/FocusProposal'
        policy_required:
          type: boolean

    FocusSessionRequest:
      type: object
      required:
        - user_id
        - action
      properties:
        user_id:
          type: string
        action:
          type: string
          enum: [start, stop]
        duration_minutes:
          type: integer
          minimum: 5
          maximum: 240
          default: 45
        session_id:
          type: string

    FocusSessionResponse:
      type: object
      required:
        - session_id
        - user_id
        - status
        - started_at
      properties:
        session_id:
          type: string
        user_id:
          type: string
        status:
          type: string
          enum: [active, completed, cancelled]
        started_at:
          type: number
        expires_at:
          type: number

    ConsentGrant:
      type: object
      required:
        - grant_id
        - user_id
        - action_type
        - scope
        - target_allowlist
        - active
        - created_at
      properties:
        grant_id:
          type: string
        user_id:
          type: string
        tenant_id:
          type: string
          default: tenant_default
        action_type:
          type: string
          enum: [nudge, request_dnd, request_pause, slack_status]
        scope:
          type: string
          enum: [ask_every_time, allow_session, allow_always, never]
        target_allowlist:
          type: array
          items:
            type: string
        active:
          type: boolean
        created_at:
          type: number
        expires_at:
          type: number

    CreateConsentGrantRequest:
      type: object
      required:
        - user_id
        - action_type
        - scope
      properties:
        user_id:
          type: string
        tenant_id:
          type: string
          default: tenant_default
        action_type:
          type: string
          enum: [nudge, request_dnd, request_pause, slack_status]
        scope:
          type: string
          enum: [ask_every_time, allow_session, allow_always, never]
        target_allowlist:
          type: array
          items:
            type: string
          default: []
        ttl_seconds:
          type: integer
          default: 86400

    AuditRecord:
      type: object
      required:
        - action_id
        - user_id
        - action_type
        - status
        - timestamp
      properties:
        action_id:
          type: string
        user_id:
          type: string
        action_type:
          type: string
        target_device:
          type: string
        status:
          type: string
          enum: [executed, blocked, suggested, undone]
        reason:
          type: string
        undo_token:
          type: string
        timestamp:
          type: number

    ErrorResponse:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object

    SlackOAuthAuthorizeResponse:
      type: object
      required:
        - authorization_url
        - state
        - code_challenge
        - code_challenge_method
        - scopes
      properties:
        authorization_url:
          type: string
        state:
          type: string
        code_challenge:
          type: string
        code_challenge_method:
          type: string
          enum: [S256]
        scopes:
          type: array
          items:
            type: string
        expires_in_seconds:
          type: integer

    SlackOAuthCallbackRequest:
      type: object
      required:
        - code
        - state
        - code_verifier
        - workspace_id
      properties:
        code:
          type: string
        state:
          type: string
        code_verifier:
          type: string
        workspace_id:
          type: string
        workspace_name:
          type: string
        admin_user_id:
          type: string
        allowed_channels:
          type: array
          items:
            type: string

    SlackOAuthCallbackResponse:
      type: object
      required:
        - status
        - workspace_id
        - workspace_name
        - is_admin_approved
        - token_secret_arn
        - allowed_channels
      properties:
        status:
          type: string
          enum: [connected, pending_review, rejected]
        workspace_id:
          type: string
        workspace_name:
          type: string
        is_admin_approved:
          type: boolean
        token_secret_arn:
          type: string
        allowed_channels:
          type: array
          items:
            type: string
        message:
          type: string

    SlackPreviewResponse:
      type: object
      required:
        - user_id
        - status_text
        - status_emoji
        - status_expiration
        - target_channel
        - zero_leakage_verified
        - preview_rendered
      properties:
        user_id:
          type: string
        status_text:
          type: string
        status_emoji:
          type: string
        status_expiration:
          type: integer
        target_channel:
          type: string
        duration_minutes:
          type: integer
        zero_leakage_verified:
          type: boolean
        privacy_notice:
          type: string
        preview_rendered:
          type: string

    SlackStatusPublishRequest:
      type: object
      required:
        - user_id
      properties:
        user_id:
          type: string
        workspace_id:
          type: string
          default: T012345678
        channel_id:
          type: string
          default: user_profile
        duration_minutes:
          type: integer
          default: 45
        custom_status:
          type: string
        status_emoji:
          type: string
          default: ":focus:"
        idempotency_key:
          type: string

    SlackStatusPublishResponse:
      type: object
      required:
        - decision
        - receipt_id
        - undo_token
        - user_id
        - workspace_id
        - target_channel
        - status_text
        - status_emoji
        - posted_at
        - expires_at
        - zero_leakage_verified
      properties:
        decision:
          type: string
          enum: [executed, duplicate, blocked]
        receipt_id:
          type: string
        undo_token:
          type: string
        user_id:
          type: string
        workspace_id:
          type: string
        target_channel:
          type: string
        status_text:
          type: string
        status_emoji:
          type: string
        posted_at:
          type: number
        expires_at:
          type: number
        ttl_seconds:
          type: integer
        zero_leakage_verified:
          type: boolean

    SlackAdminReviewRequest:
      type: object
      required:
        - workspace_id
        - admin_user_id
        - is_approved
        - allowed_channels
      properties:
        workspace_id:
          type: string
        admin_user_id:
          type: string
        is_approved:
          type: boolean
        allowed_channels:
          type: array
          items:
            type: string
