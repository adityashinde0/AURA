name: Firmware CI

on:
  push:
    paths:
      - 'firmware/**'
  pull_request:
    paths:
      - 'firmware/**'

jobs:
  build:
    name: Zephyr / NCS dry-run build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install west
        run: pip install west

      - name: Install Zephyr / NCS dependencies
        run: |
          pip install \
            cmake \
            ninja \
            pyelftools \
            pyyaml \
            packaging \
            setuptools

      - name: Install Zephyr SDK
        run: |
          wget -q https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v0.16.8/zephyr-sdk-0.16.8_linux-x86_64_minimal.tar.xz
          tar -xf zephyr-sdk-0.16.8_linux-x86_64_minimal.tar.xz -C $HOME
          $HOME/zephyr-sdk-0.16.8/setup.sh -t arm-zephyr-eabi -h -c

      - name: Initialize west workspace (NCS)
        run: |
          west init -m https://github.com/nrfconnect/sdk-nrf --mr v2.6.0 ncs
          cd ncs
          west update --narrow -o=--depth=1

      - name: Dry-run build (nrf5340dk cpuapp)
        working-directory: ncs
        run: |
          west build \
            -b nrf5340dk/nrf5340/cpuapp \
            ${{ github.workspace }}/firmware \
            --pristine
