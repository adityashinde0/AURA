name: Firmware CI

on:
  push:
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware_ci.yml'
  pull_request:
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware_ci.yml'

jobs:
  validate:
    name: Firmware Architecture & Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Static Analysis Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y cppcheck

      - name: Verify Firmware Architecture & Component Integrity
        working-directory: firmware
        run: |
          python3 -c "
          import os

          # 1. Kconfig checks
          with open('prj.conf') as f:
              kconfigs = {line.split('=', 1)[0].strip(): line.split('=', 1)[1].strip() for line in f if line.strip() and not line.strip().startswith('#') and '=' in line}
          for req in ['CONFIG_BT', 'CONFIG_GPIO', 'CONFIG_I2C', 'CONFIG_PM_DEVICE', 'CONFIG_LOG']:
              assert req in kconfigs, f'Missing required Kconfig: {req}'

          # 2. Overlay checks
          with open('boards/nrf5340dk_nrf5340_cpuapp.overlay') as f:
              dts = f.read()
          for node in ['aliases', 'button_crescent', 'mic_power_gate', 'privacy_led_ring', 'drv2605l']:
              assert node in dts, f'Missing node in overlay: {node}'

          # 3. Header and API signatures
          for h in ['ble_orbit_service.h', 'haptic_driver.h', 'privacy_gate.h']:
              with open(os.path.join('src', h)) as f:
                  content = f.read()
              assert '#ifndef' in content and '#endif' in content

          with open('src/privacy_gate.h') as f:
              c = f.read()
              assert 'privacy_gate_init' in c and 'privacy_gate_open' in c

          with open('src/haptic_driver.h') as f:
              c = f.read()
              assert 'haptic_driver_init' in c and 'haptic_play' in c

          with open('src/ble_orbit_service.h') as f:
              c = f.read()
              assert 'ble_orbit_service_init' in c

          with open('src/main.c') as f:
              main_c = f.read()
              assert 'privacy_gate_init' in main_c
              assert 'haptic_driver_init' in main_c
              assert 'ble_orbit_service_init' in main_c
              assert 'CMD_FOCUS_START' in main_c
              assert 'CMD_DISTRACTED' in main_c
              assert 'CMD_ACK' in main_c

          print('[PASS] Firmware architecture and component interfaces successfully verified.')
          "

      - name: Run Cppcheck Static Analysis on Firmware Sources
        working-directory: firmware
        run: |
          cppcheck --enable=warning,performance,portability \
                   --suppress=missingInclude \
                   --suppress=missingIncludeSystem \
                   --suppress=unusedFunction \
                   --suppress=unmatchedSuppression \
                   --inline-suppr \
                   -I src \
                   src/
