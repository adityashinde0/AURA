name: Firmware CI

on:
  push:
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware_ci.yml'
  pull_request:
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware_ci.yml'

jobs:
  validate:
    name: Firmware Architecture & Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Static Analysis Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y cppcheck

      - name: Validate prj.conf Kconfig Syntax
        working-directory: firmware
        run: |
          python3 -c "
          with open('prj.conf') as f:
              for line in f:
                  line = line.strip()
                  if not line or line.startswith('#'):
                      continue
                  assert '=' in line, f'Invalid Kconfig line: {line}'
                  key, val = line.split('=', 1)
                  assert key.startswith('CONFIG_'), f'Missing CONFIG_ prefix: {key}'
          print('prj.conf Kconfig validated successfully.')
          "

      - name: Validate Devicetree Overlay Syntax
        working-directory: firmware
        run: |
          python3 -c "
          with open('boards/nrf5340dk_nrf5340_cpuapp.overlay') as f:
              content = f.read()
          assert 'aliases {' in content
          assert 'button_crescent' in content
          assert 'mic_power_gate' in content
          assert 'privacy_led_ring' in content
          assert 'drv2605l' in content
          print('Devicetree overlay structure validated successfully.')
          "

      - name: Run Cppcheck Static Analysis on Firmware Sources
        working-directory: firmware
        run: |
          cppcheck --error-exitcode=1 \
                   --enable=warning,performance,portability \
                   --suppress=missingIncludeSystem \
                   --suppress=unmatchedSuppression \
                   --inline-suppr \
                   -I src \
                   src/
