name: Apple CI

on:
  push:
    paths:
      - 'apple/**'
      - '.github/workflows/apple_ci.yml'
  pull_request:
    paths:
      - 'apple/**'
      - '.github/workflows/apple_ci.yml'

jobs:
  build:
    name: Build & Validate Apple Sources
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Swift & Xcode version
        run: |
          swift --version
          xcodebuild -version

      - name: Validate AURAShared Swift package
        working-directory: apple
        run: swift build

      - name: Validate Swift syntax across watchOS and iOS targets
        working-directory: apple
        run: |
          find . -name "*.swift" -not -path "*/.*" -not -path "*/.build/*" -print0 | xargs -0 -n 1 swiftc -parse
